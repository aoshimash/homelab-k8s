clusterName: homelab-cluster
talosVersion: v1.14.1
kubernetesVersion: v1.36.2
endpoint: https://192.168.0.10:6443

# Disable Talos default CNI (Flannel) to use Cilium
cniConfig:
  name: none

# Allow scheduling workloads on control plane nodes for single node cluster
allowSchedulingOnControlPlanes: true

# Cluster-wide patches.
#
# These are Talos 1.14+ multi-document patches (KubeProxyConfig,
# KubeControllerManagerConfig), not the older v1alpha1 `cluster.*` form, and the
# patch form is tied to `talosVersion` above. `talosVersion` decides which
# documents talhelper asks Talos to generate; patching the same setting in the
# other form then fails config validation as a conflict. So a `talosVersion`
# bump back below v1.14 must convert these patches back to `cluster.proxy` /
# `cluster.controllerManager` in the same change, or `talhelper genconfig`
# fails.
#
# Do not "fix" that by making one patch set generate under both versions — it is
# possible (delete the v1alpha1 sections and set an explicit image), but the
# result is a config a pre-1.14 node cannot decode, so it fails at apply time
# instead of at generation. See issue #315 and the revert in #314.
patches:
  # Disable kube-proxy (Cilium handles this with kubeProxyReplacement=true)
  - |-
    apiVersion: v1alpha1
    kind: KubeProxyConfig
    enabled: false
  # Bound how many terminated pods the cluster keeps, so pod residue left by a
  # node reboot is garbage-collected instead of accumulating indefinitely.
  #
  # kube-controller-manager's PodGC deletes terminated pods (phase Succeeded or
  # Failed) once their total count exceeds --terminated-pod-gc-threshold,
  # removing the excess oldest-first (evicted pods first, then by ascending
  # creationTimestamp). Upstream defaults the threshold to 12500; on this
  # low-churn single-node cluster the count never approaches that, so PodGC
  # effectively never fires. That is why reboot residue sat around for months —
  # see issue #246, and the 2026-08-30 cleanup of 15 Failed-phase pods dating
  # back to the 2026-07-02 reboot.
  #
  # 30 is chosen just above the largest set of terminated pods this cluster
  # legitimately wants to keep: the 9 CronJobs retain at most 8 x 3 + 1 x 1 = 25
  # completed Job pods via their successfulJobsHistoryLimit. Oldest-first
  # deletion means multi-month-old reboot debris is evicted long before those,
  # and a pod that failed *recently* is the last thing PodGC touches — its logs
  # and exit code stay available for debugging, which is why #246 rejected a
  # blanket scheduled sweep.
  - |-
    apiVersion: v1alpha1
    kind: KubeControllerManagerConfig
    extraArgs:
      terminated-pod-gc-threshold: "30"

nodes:
  - hostname: homelab-node-01
    ipAddress: 192.168.0.10
    controlPlane: true
    installDisk: /dev/nvme0n1
    # Image Factory Schematic: https://factory.talos.dev/?arch=amd64&bootloader=auto&cmdline-set=true&extensions=-&extensions=siderolabs%2Fiscsi-tools&extensions=siderolabs%2Ftailscale&platform=metal&target=metal&version=1.12.0
    # Extensions: siderolabs/iscsi-tools (for Longhorn), siderolabs/tailscale
    talosImageURL: factory.talos.dev/installer/e2e3b54334c85fdef4d78e88f880d185e0ce0ba0c9b5861bb5daa1cd6574db9b
    patches:
      # Wipe disk on install
      - |-
        machine:
          install:
            wipe: true
      # Tailscale extension service configuration.
      #
      # NOTE: We tried `TS_DEBUG_FIREWALL_MODE=iptables` (PRs #209/#210) to
      # silence Cilium's "table 'nat' is incompatible, use 'nft' tool" log
      # noise by making tailscaled write rules via iptables-nft instead of
      # libnftnl. It does not work on Talos: the siderolabs/tailscale
      # extension image does not bundle the `iptables` binary, so tailscaled
      # immediately crashes on startup with:
      #
      #   router.Up: setting netfilter mode: could not create new netfilter:
      #   exec: "iptables": executable file not found in $PATH
      #
      # Tailscale connectivity (incl. talosctl/kubectl access via the tailnet
      # IP) is broken until the env var is removed. Until siderolabs/extensions
      # ships iptables in this image, leaving tailscaled in default `auto`
      # mode is the only working option. Cilium's iptables-incompatibility
      # noise is documented in docs/talos-operations.md as known/cosmetic.
      - |-
        apiVersion: v1alpha1
        kind: ExtensionServiceConfig
        name: tailscale
        environment:
          - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      # Root directory for local-path-provisioner (k8s/infrastructure/local-path-provisioner),
      # mounted at /var/mnt/local-path-provisioner and propagated into the kubelet.
      #
      # `directory`, not the default `partition` type: this node has one disk and
      # EPHEMERAL already spans all of it, so there is no free space to carve a
      # partition from. EPHEMERAL cannot be shrunk in place either — Talos honours
      # a VolumeConfig only when the volume is first provisioned — so a partition
      # would mean re-provisioning EPHEMERAL, which on a single node wipes etcd
      # and every workload's data. A directory volume lives on EPHEMERAL instead,
      # with no filesystem-level isolation: its capacity is whatever EPHEMERAL has
      # free, shared with etcd, containerd and the kubelet. See issue #302 and
      # docs/local-path-provisioner.md.
      - |-
        apiVersion: v1alpha1
        kind: UserVolumeConfig
        name: local-path-provisioner
        volumeType: directory
