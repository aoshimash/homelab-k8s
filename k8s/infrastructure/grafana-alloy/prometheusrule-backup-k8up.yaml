# K8up (restic) backup alerts. Synced to the Grafana Cloud ruler by Grafana
# Alloy (mimir.rules.kubernetes) and evaluated there against three
# remote-written sources:
# - k8up_jobs_failed_counter from the K8up operator (k8up scrape job), which
#   counts failed job objects per namespace and job type (backup/check/prune
#   used here).
# - kube_customresource_k8up_snapshot_timestamp_seconds from kube-state-metrics
#   (CustomResourceState over K8up Snapshot resources), one series per restic
#   snapshot, labelled with its namespace and path.
# - kube_persistentvolumeclaim_annotations from kube-state-metrics, one series
#   per PVC carrying its k8up.io/backup annotation (metricAnnotationsAllowList).
# Failure alone is not enough: a backup-command dump whose pod is not Running
# is skipped without failing the Backup, so only per-path freshness catches it.
# Neither catches a volume nobody opted in: backups are opt-in, so the
# coverage group alerts on PVCs with no recorded backup decision.
# The chart's own metrics.prometheusRule is not used (see docs/backup-alerting.md).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: k8up-backup-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: k8up
    role: backup-alerts
spec:
  groups:
    - name: k8up-backup
      rules:
        - alert: K8upJobFailed
          # A backup failed in the last 26h (daily schedule + buffer), or a
          # check/prune in the last 8d (weekly + a day). The counter goes up
          # once when an object first becomes Failed; increase() absorbs the
          # reset on an operator restart. Keeps firing while failures land
          # inside the window; clears once the window holds none, which is
          # about 2h (backup) or 1d (check/prune) after the next run if that
          # run succeeds.
          # k8up_schedule_last_job_succeeded is not used: in K8up v2.16.0 it
          # is never set for backups, and for check/prune it is re-set from
          # every retained object in arbitrary order (docs/backup-alerting.md).
          expr: >-
            increase(k8up_jobs_failed_counter{jobType="backup"}[26h]) > 0
            or increase(k8up_jobs_failed_counter{jobType=~"check|prune"}[8d]) > 0
          for: 5m
          labels:
            severity: critical
            component: k8up
          annotations:
            summary: "K8up job failed"
            description: >-
              A K8up {{ $labels.jobType }} job in {{ $labels.namespace }}
              failed recently (backup: last 26h, check/prune: last 8d). Check
              `kubectl -n {{ $labels.namespace }} get jobs` and the job log,
              and the k8up-backup credentials / R2 connectivity.
        - alert: K8upBackupStale
          # Newest snapshot per backed-up path older than 26h (daily schedule
          # at 19:00 UTC + buffer). Every path in every namespace is covered
          # without a rule change, including backup-command dumps such as
          # /audiobookshelf-audiobookshelf.sqlite. A path that is no longer
          # backed up keeps its snapshots under restic retention and alerts
          # until they are forgotten (see docs/backup-alerting.md).
          expr: (time() - max by (namespace, path) (kube_customresource_k8up_snapshot_timestamp_seconds)) > 93600
          for: 15m
          labels:
            severity: critical
            component: k8up
          annotations:
            summary: "K8up backup stale"
            description: >-
              The newest K8up snapshot of {{ $labels.path }} in
              {{ $labels.namespace }} is over 26h old despite the daily
              schedule. Backups of this path have stopped or are being
              skipped (for a backup-command dump: its pod was not Running at
              backup time). If the path was retired on purpose, forget its
              snapshots.
        - alert: K8upSnapshotMetricsAbsent
          # K8upBackupStale over a missing metric returns nothing and never
          # fires. This fires if no snapshot series reaches Grafana Cloud at
          # all (kube-state-metrics down or misconfigured, or every Snapshot
          # resource gone).
          expr: absent(kube_customresource_k8up_snapshot_timestamp_seconds)
          for: 1h
          labels:
            severity: critical
            component: k8up
          annotations:
            summary: "K8up snapshot metrics absent"
            description: >-
              No kube_customresource_k8up_snapshot_timestamp_seconds series
              has reached Grafana Cloud for 1h, so K8upBackupStale cannot
              fire. Check the kube-state-metrics pod and its
              CustomResourceState config, and that
              `kubectl get snapshots.k8up.io -A` lists snapshots.
    - name: k8up-backup-coverage
      rules:
        - alert: K8upBackupAnnotationMissing
          # Backups are opt-in (k8up.skipWithoutAnnotation), so a PVC nobody
          # marked is silently not backed up. Every PVC must record a
          # decision: k8up.io/backup "true" (back up) or "false" (deliberately
          # not). A missing annotation means an absent label, which the regex
          # below treats like any other non-matching value. K8up reads the
          # value with Go's strconv.ParseBool and skips anything that does not
          # parse as true, so a typo such as "yes" is not backed up either and
          # alerts here too.
          # 1h: nothing is lost before the next daily backup, and a PVC
          # applied from Git carries its annotation from creation.
          expr: kube_persistentvolumeclaim_annotations{annotation_k8up_io_backup!~"true|false"}
          for: 1h
          labels:
            severity: warning
            component: k8up
          annotations:
            summary: "PVC has no K8up backup decision"
            description: >-
              PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}
              has no k8up.io/backup annotation set to exactly "true" or
              "false", so whether K8up backs it up was never decided
              explicitly. Decide whether its data is worth protecting and set
              k8up.io/backup to "true" or "false" on the PVC in Git (for a
              CloudNativePG volume, in the Cluster's inheritedMetadata). See
              docs/k8up.md, "Backup decision for every PVC".
        - alert: K8upBackupAnnotationMetricsAbsent
          # K8upBackupAnnotationMissing over a missing metric returns nothing
          # and never fires. kube-state-metrics emits no
          # kube_persistentvolumeclaim_annotations series at all when its
          # metricAnnotationsAllowList has no persistentvolumeclaims entry.
          expr: absent(kube_persistentvolumeclaim_annotations)
          for: 1h
          labels:
            severity: warning
            component: k8up
          annotations:
            summary: "PVC annotation metrics absent"
            description: >-
              No kube_persistentvolumeclaim_annotations series has reached
              Grafana Cloud for 1h, so K8upBackupAnnotationMissing cannot
              fire. Check the kube-state-metrics pod and that its
              metricAnnotationsAllowList still lists
              persistentvolumeclaims=[k8up.io/backup].
