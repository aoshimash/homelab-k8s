apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 10m0s
  chart:
    spec:
      chart: longhorn
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      # Pinned to avoid automatic upgrades; adjust as needed after validating against the repo's upgrade policy.
      # NOTE: Longhorn requires sequential minor version upgrades (v1.7.3 → v1.8.x → v1.9.x → v1.10.x)
      # Current cluster version: v1.10.1
      version: 1.12.1
  releaseName: longhorn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    defaultSettings:
      # Single-node cluster default (clarified in spec): replicas must be 1.
      defaultReplicaCount: 1
    # Cloudflare R2 (S3-compatible) backup target (1.10.x recommended location).
    defaultBackupStore:
      backupTarget: s3://homelab-longhorn-backups@auto/longhorn/
      backupTargetCredentialSecret: longhorn-r2-credentials
    # StorageClass settings for single-node cluster.
    persistence:
      defaultClassReplicaCount: 1
      # Left disabled. When enabled, `jobList` must be given as a JSON *string*
      # — the chart interpolates it verbatim (`recurringJobSelector: '{{ ... }}'`
      # in templates/storageclass.yaml), so a YAML list renders as Go map format.
      # The chart's own values comment says as much: "Ensure that quotes are used
      # correctly when specifying job parameters."
      # Disabling it does NOT exclude volumes from recurring jobs: Longhorn then
      # places every volume in the `default` group, which backup-daily targets.
      # Changing this only affects volumes created afterwards.
      # See docs/longhorn.md, "How recurring jobs pick volumes".
      recurringJobSelector:
        enable: false
