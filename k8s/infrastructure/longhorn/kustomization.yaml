apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Removal in progress (#305). The HelmRelease is gone, so Flux uninstalls the
# chart. Its pre-delete hook runs the `longhorn-uninstall` Job in this
# namespace, so the namespace has to outlive the uninstall: if Flux pruned it
# together with the HelmRelease, the namespace would start terminating and the
# hook Job could not be created. The follow-up change removes this directory
# once the uninstall has finished.
resources:
  - namespace.yaml
  - secret-r2-credentials.sops.yaml
