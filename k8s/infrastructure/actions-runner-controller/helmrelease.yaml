apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-controller
  namespace: arc-systems
spec:
  interval: 10m0s
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
      # Pinned; Renovate proposes upgrades (flux manager covers k8s/infrastructure).
      # Keep in step with the gha-runner-scale-set charts in k8s/configs/arc-runners.
      version: 0.14.2
  releaseName: arc-controller
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1
