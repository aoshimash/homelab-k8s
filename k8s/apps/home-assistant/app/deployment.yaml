apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate. `home-assistant-config` is a
  # single RWO volume, and a rolling update briefly runs the new pod alongside
  # the old one on the same node, both mounting it. Home Assistant 2026 makes
  # that fatal: it takes an exclusive flock on `.ha_run.lock` in the config
  # directory, so the new pod exits with "Another Home Assistant instance is
  # already running!" while the old pod holds the lock — and the old pod is
  # never retired, because the new one never turns Ready. Deadlock.
  # Before 2026 there was no lock and the rollout appeared to work, which only
  # meant two instances wrote to /config and the recorder database at once.
  # Matches vikunja and paperless-ngx, which already do this.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      nodeSelector:
        kubernetes.io/hostname: homelab-node-01
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.9@sha256:d8922685169707fd91e8b9729902d975f06157d005e422874d201e0261dda196
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8123
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: home-assistant-db-url
                  key: DB_URL
          volumeMounts:
            - name: config
              mountPath: /config
            - name: automations
              mountPath: /config/automations.yaml
              subPath: automations.yaml
            - name: recorder-config
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: automations
          configMap:
            name: home-assistant-automations
        - name: recorder-config
          configMap:
            name: home-assistant-recorder-config
