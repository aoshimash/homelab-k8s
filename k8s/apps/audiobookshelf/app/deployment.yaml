apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate. At replicas: 1 the default
  # maxSurge of 25% rounds up to 1, so a rolling update starts the new pod
  # while the old one still holds the three RWO volumes below on the same
  # node — two Audiobookshelf processes writing one SQLite database and one
  # metadata directory. Home Assistant made this visible by refusing to start
  # a second instance at all (see #324); here nothing complains, which is the
  # worse failure mode. Matches vikunja and paperless-ngx.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 99
        fsGroup: 99
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: audiobookshelf
          # trivy:ignore:AVD-KSV-0014 - audiobookshelf needs to write config and podcasts to mounted volumes
          image: ghcr.io/advplyr/audiobookshelf:2.36.1@sha256:3528a93b6442ffe54bd46771bbbab7c97084e1101071586d9dc2254f30bb4358
          ports:
            - containerPort: 80
          env:
            - name: AUDIOBOOKSHELF_UID
              value: "99"
            - name: AUDIOBOOKSHELF_GID
              value: "99"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
            - name: metadata
              mountPath: /metadata
            - name: podcasts
              mountPath: /podcasts
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: audiobookshelf-config
        - name: metadata
          persistentVolumeClaim:
            claimName: audiobookshelf-metadata
        - name: podcasts
          persistentVolumeClaim:
            claimName: audiobookshelf-podcasts
