apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-config
  namespace: audiobookshelf
  annotations:
    # Opt-in K8up backup (docs/k8up.md).
    k8up.io/backup: "true"
    # The open SQLite database is left out of the file-level copy; it is
    # captured consistently by the backupcommand on the Deployment instead.
    k8up.io/backup-restic-args: '["--exclude", "absdatabase.sqlite*"]'
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-metadata
  namespace: audiobookshelf
  annotations:
    # Opt-in K8up backup (docs/k8up.md).
    k8up.io/backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-podcasts
  namespace: audiobookshelf
  annotations:
    # Opt-in K8up backup (docs/k8up.md).
    k8up.io/backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
