apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vikunja-files
  namespace: vikunja
  annotations:
    # Opt-in K8up backup (docs/k8up.md).
    k8up.io/backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      # local-path does not enforce capacity; this records the expected size
      # (docs/local-path-provisioner.md#capacity).
      storage: 1Gi
