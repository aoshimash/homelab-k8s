apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-config
  namespace: paperless-ngx
data:
  PAPERLESS_REDIS: redis://localhost:6379
  # v3 documents this as required for PostgreSQL. The v3.2.1 code still infers
  # postgresql from PAPERLESS_DBHOST (set in the paperless-db Secret), but the
  # inference is the compatibility path, not the contract — state the engine.
  PAPERLESS_DBENGINE: postgresql
  PAPERLESS_TIKA_ENABLED: "true"
  PAPERLESS_TIKA_ENDPOINT: http://localhost:9998
  PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://localhost:3000
  PAPERLESS_OCR_LANGUAGE: jpn+eng
  # v3 split the single OCR_MODE setting into two independent ones. The old
  # `skip` value is gone; v3 maps it to `auto` at startup but logs W003 for it.
  # `skip` also implied "always produce an archive", which `auto` does not — so
  # ARCHIVE_FILE_GENERATION pins the v2 behaviour explicitly. Switch it to
  # `auto` to stop archiving born-digital PDFs, as a deliberate change.
  PAPERLESS_OCR_MODE: auto
  PAPERLESS_ARCHIVE_FILE_GENERATION: always
  PAPERLESS_OCR_OUTPUT_TYPE: pdfa
  # Renamed in v3; the default is 0 either way, i.e. inotify rather than polling.
  PAPERLESS_CONSUMER_POLLING_INTERVAL: "0"
  PAPERLESS_TIME_ZONE: Asia/Tokyo
