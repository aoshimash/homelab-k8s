apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: outline-data
  namespace: outline
  annotations:
    # Opt-in K8up backup (docs/k8up.md). Attachments and images
    # (FILE_STORAGE=local); the documents themselves live in the CNPG database.
    k8up.io/backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      # local-path does not enforce capacity; this records the expected size
      # (docs/local-path-provisioner.md#capacity).
      storage: 2Gi
