apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: postgres
spec:
  instances: 1
  # Records the K8up backup decision for PGDATA: deliberately not backed up by
  # K8up, because a file-level copy of a live PostgreSQL data directory is not
  # a valid backup; CloudNativePG's barman backup below covers it. The operator
  # copies inheritedMetadata onto every object it creates for this Cluster,
  # PVCs included, and keeps existing ones in sync, so a replacement cluster
  # or a new instance gets the marking without a separate manifest. Keep this
  # when replacing the Cluster: without it, K8upBackupAnnotationMissing fires
  # for the new PVC. See docs/k8up.md, "Backup decision for every PVC".
  inheritedMetadata:
    annotations:
      k8up.io/backup: "false"
  # vectorchord-enabled image (Postgres major 16 unchanged). It was adopted for
  # Immich's Smart Search and facial recognition, which need vchord + pgvector +
  # earthdistance. Immich has since been removed, so nothing here uses those
  # extensions any more — the image stays because swapping the system image
  # restarts the instance every remaining database depends on, which is a
  # deliberate maintenance operation rather than a cleanup. Revisit if the
  # vectorchord image ever lags the stock cloudnative-pg PG16 image on patches.
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16-1.1.1
  postgresql:
    # vchord.so must be preloaded at startup for the vchord extension to load.
    shared_preload_libraries:
      - "vchord.so"
  storage:
    # local-path does not enforce capacity, so this size is documentation
    # only. PGDATA was ~660Mi on 2026-10-05. It stays 10Gi because the
    # CloudNativePG webhook rejects shrinking the storage size of an existing
    # Cluster, and the size cannot be lowered without recreating it.
    size: 10Gi
    # The storage class applies only to PVCs created after it changes. An
    # existing instance keeps its volume until the instance is replaced.
    storageClass: local-path
  backup:
    retentionPolicy: "7d"
    barmanObjectStore:
      destinationPath: "s3://homelab-postgres-backups/cnpg/"
      endpointURL: "https://b2142226728f160a9b43fe01f0fe5f71.r2.cloudflarestorage.com"
      s3Credentials:
        accessKeyId:
          name: postgres-r2-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: postgres-r2-credentials
          key: ACCESS_SECRET_KEY
  managed:
    roles:
      - name: vikunja
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: postgres-vikunja-user
      - name: paperless
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: postgres-paperless-user
