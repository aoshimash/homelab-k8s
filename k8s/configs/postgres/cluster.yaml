apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: postgres
spec:
  instances: 1
  # vectorchord-enabled image (Postgres major 16 unchanged). It was adopted for
  # Immich's Smart Search and facial recognition, which need vchord + pgvector +
  # earthdistance. Immich has since been removed, so nothing here uses those
  # extensions any more — the image stays because swapping the system image
  # restarts the instance every remaining database depends on, which is a
  # deliberate maintenance operation rather than a cleanup. Revisit if the
  # vectorchord image ever lags the stock cloudnative-pg PG16 image on patches.
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16-1.1.1
  postgresql:
    # vchord.so must be preloaded at startup for the vchord extension to load.
    shared_preload_libraries:
      - "vchord.so"
  storage:
    size: 10Gi
    storageClass: longhorn
    # PGDATA is backed up by Longhorn's backup-daily job as well as by CNPG's
    # own barman backup below. That is not the intent recorded here previously,
    # but it is what happens: with no recurringJobSelector set anywhere,
    # Longhorn puts every volume in the `default` group, which backup-daily
    # targets. See docs/longhorn.md, "How recurring jobs pick volumes".
    # CNPG's barman backup remains the authoritative restore path for Postgres;
    # the Longhorn copy is a crash-consistent snapshot of a running PGDATA and
    # is not the route docs/cloudnative-pg.md restores from.
  backup:
    retentionPolicy: "7d"
    barmanObjectStore:
      destinationPath: "s3://homelab-postgres-backups/cnpg/"
      endpointURL: "https://b2142226728f160a9b43fe01f0fe5f71.r2.cloudflarestorage.com"
      s3Credentials:
        accessKeyId:
          name: postgres-r2-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: postgres-r2-credentials
          key: ACCESS_SECRET_KEY
  managed:
    roles:
      - name: vikunja
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: postgres-vikunja-user
      - name: paperless
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: postgres-paperless-user
