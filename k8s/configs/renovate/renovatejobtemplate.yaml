# Settings every RenovateJob generated by the installation set inherits.
# Inheritance is per top-level field with no deep merge: a generated job that
# overrides webhook, renovateConfig, extraEnv, etc. replaces the whole field.
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJobTemplate
metadata:
  name: installation-defaults
  namespace: renovate-operator
spec:
  image: ghcr.io/renovatebot/renovate:44.257.6@sha256:6a036e222c8b172734be034d22d3df96d73a4e701a38bd14ea1bb97887705e75
  # Hourly, at a minute derived from each generated job's name. Webhooks
  # cover interactive triggers; each repository's own `schedule` still
  # decides when PRs may be opened. Cron is evaluated in UTC.
  schedule: "H * * * *"
  parallelism: 2
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 2Gi
  webhook:
    enabled: true
    # Required, not optional: the same listener serves /webhook/v1/schedule,
    # which accepts a run request for any job whose webhook authentication is
    # off. The secret is also the GitHub App's webhook secret, so it verifies
    # GitHub's X-Hub-Signature-256 on PR and issue events.
    authentication:
      enabled: true
      secretRef:
        name: renovate-github-app-webhook
        key: secret
  renovateConfig:
    fileName: config.json
    inline: |
      {
        "extends": ["mergeConfidence:all-badges"],
        "dependencyDashboard": {
          "footer": "- [ ] <!-- manual job -->Check this box to trigger a request for Renovate to run again on this repository"
        }
      }
