apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homelab-k8s-runners
  namespace: arc-runners
spec:
  interval: 10m0s
  chart:
    spec:
      chart: gha-runner-scale-set
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
      # Pinned; Renovate proposes upgrades (flux manager covers k8s/configs).
      # Keep in step with the gha-runner-scale-set-controller chart version.
      version: 0.15.1
  releaseName: homelab-k8s-runners
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    githubConfigUrl: "https://github.com/aoshimash/homelab-k8s"
    githubConfigSecret: arc-github-app
    runnerScaleSetName: homelab-homelab-k8s
    minRunners: 0
    maxRunners: 3
    
    containerMode:
      type: kubernetes
      kubernetesModeWorkVolumeClaim:
        accessModes: ["ReadWriteOnce"]
        # The work volume is an ephemeral claim that lives as long as the
        # runner pod. local-path-ephemeral reclaims with Delete, so the PV and
        # its directory on the node go away with it; `local-path` (Retain)
        # would leave both behind after every job.
        storageClassName: "local-path-ephemeral"
        resources:
          requests:
            storage: 1Gi
    
    template:
      spec:
        securityContext:
          fsGroup: 1001
        containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:2.338.2@sha256:759a1d94a15b05941aba5196974ff43fe15b4cbba29b694b35cbc32a1166b232
          command: ["/home/runner/run.sh"]
          env:
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            value: "false"
